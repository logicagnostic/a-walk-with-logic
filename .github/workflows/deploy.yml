name: Build and deploy site

on:
  # Rebuild whenever a change is pushed to main
  push:
    branches: ["main"]

  # Rebuild once a day so future-dated posts publish automatically
  # (07:00 UTC ≈ midnight Pacific / 3am Eastern — adjust if you want a different time)
  schedule:
    - cron: "0 7 * * *"

  # Allows manually triggering a rebuild from the GitHub Actions tab if ever needed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
